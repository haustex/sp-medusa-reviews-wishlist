name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml runs the full suite before publishing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Medusa ${{ matrix.medusa }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 2.19.0 is the lockfile's (lowest supported) version; 2.22.2 the latest tested
        medusa: ["2.19.0", "2.22.2"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Use Medusa ${{ matrix.medusa }}
        if: matrix.medusa != '2.19.0'
        run: node scripts/use-medusa.mjs ${{ matrix.medusa }}

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - name: Package contents
        run: node scripts/check-pack.mjs

      # Same container name and port as CONTRIBUTING.md; scripts/guard.mjs accepts nothing else.
      - name: Start Postgres
        # Healthy only once the final server answers over TCP (the image's init server is socket-only and restarts)
        run: |
          docker run -d --name rw-spike-pg -e POSTGRES_PASSWORD=spike -e POSTGRES_DB=rw_spike \
            --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 1s --health-timeout 5s --health-retries 60 \
            -p 127.0.0.1:55436:5432 postgres:17-alpine
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' rw-spike-pg)" = healthy ] && exit 0
            sleep 1
          done
          echo "::error::Postgres container rw-spike-pg not healthy after 60 s"
          docker logs rw-spike-pg | tail -30
          exit 1

      - name: E2E (trigger shipped)
        run: node integration-tests/e2e.mjs

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-logs-${{ matrix.medusa }}
          path: integration-tests/.state
          retention-days: 7
